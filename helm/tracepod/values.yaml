# imagePullSecrets: Secrets of type kubernetes.io/dockerconfigjson in the
# release namespace, used to pull images from private registries (or a
# private mirror of the sensor image).
imagePullSecrets: []
# imagePullSecrets:
#   - name: regcred

sensor:
  # traceStat additionally records stat-family existence checks (schema v4
  # access mode "s"). Higher event volume; event_loss counters surface any
  # ring-buffer pressure.
  traceStat: false
  image:
    repository: ghcr.io/tracepod/tracepod-sensor
    # tag: empty defaults to the chart's appVersion (v-prefixed, matching the
    # tag the release workflow pushes). Override to pin to a different sensor
    # version than the chart, or to a dev build.
    tag: ""
    pullPolicy: IfNotPresent

  # controllerURL: when set, the sensor POSTs per-container manifests to the
  # Tracepod controller instead of writing them to disk. Leave empty to run in
  # standalone mode — profiles are written to each node's disk via hostPath.
  #
  # Example (closed-source controller):
  #   controllerURL: "http://tracepod-controller.tracepod.svc:8080"
  controllerURL: ""

  # controllerToken: when controllerURL is set, the sensor authenticates to it
  # with a projected ServiceAccount token. The chart mounts a token for the
  # sensor's ServiceAccount, bound to `audience` and valid for
  # `expirationSeconds` (the kubelet rotates it before it expires), and passes
  # --controller-token-file. The sensor re-reads the file on every POST and
  # sends "Authorization: Bearer <token>". The receiving controller can check
  # the token with a Kubernetes TokenReview for that audience. Set enabled to
  # false to send no Authorization header. Ignored in standalone mode.
  controllerToken:
    enabled: true
    audience: tracepod-ingest
    # expirationSeconds: token lifetime; Kubernetes requires at least 600.
    expirationSeconds: 3600

  # snapshotInterval: while a container runs, the sensor POSTs a cumulative
  # interim profile snapshot (profile_terminal=false) to controllerURL at this
  # interval, in addition to the terminal POST at container stop. A Go duration
  # of at least 10s (e.g. "5m"). Empty (default) disables it. Ignored in
  # standalone mode (controllerURL empty).
  snapshotInterval: ""

  # profileHostPath: node-local directory where profile JSON files are written
  # in standalone mode (controllerURL is empty). One subdirectory per container ID.
  # Ignored when controllerURL is set.
  profileHostPath: /var/lib/tracepod/profiles

  # ringbufBytes: override the BPF events ring-buffer size, in bytes (power of
  # two, page-multiple). 0/unset keeps the default 256 KB. This is a TEST-ONLY
  # knob: a deliberately tiny buffer forces bpf_ringbuf_reserve failures under a
  # high-churn workload so the schema-v3 event_loss counters are demonstrably
  # nonzero (the induced-loss fixture). Do not set in production.
  ringbufBytes: 0

  # resources: resource requests/limits for the sensor container.
  # The sensor is lightweight — default is unbounded. Set limits for production.
  resources: {}
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi
  #   limits:
  #     memory: 256Mi

  # nodeSelector, tolerations, affinity: standard scheduling controls.
  # By default the sensor runs on every node. Use tolerations to include
  # nodes with taints (e.g. GPU nodes, spot nodes).
  nodeSelector: {}
  tolerations: []
  affinity: {}
