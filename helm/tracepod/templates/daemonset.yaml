{{- /* dig keeps upgrades with --reuse-values (values from an older chart without these keys) rendering. */ -}}
{{- $tokenEnabled := dig "controllerToken" "enabled" true .Values.sensor -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tracepod.sensorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracepod.sensorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tracepod-sensor
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "tracepod.sensorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tracepod.sensorName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostPID is required so bpf_get_current_pid_tgid() returns PIDs visible
      # in the host /proc, enabling CWD resolution for relative-path openat events.
      hostPID: true
      containers:
      - name: sensor
        image: "{{ .Values.sensor.image.repository }}:{{ .Values.sensor.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
        imagePullPolicy: {{ .Values.sensor.image.pullPolicy }}
        args:
          - --node-name=$(NODE_NAME)
          {{- if .Values.sensor.controllerURL }}
          - --controller-url={{ .Values.sensor.controllerURL }}
          {{- if $tokenEnabled }}
          - --controller-token-file=/var/run/secrets/tracepod/controller-token/token
          {{- end }}
          {{- else }}
          - --profile-dir=/profiles
          {{- end }}
          {{- if .Values.sensor.ringbufBytes }}
          - --ringbuf-bytes={{ .Values.sensor.ringbufBytes }}
          {{- end }}
          {{- if .Values.sensor.traceStat }}
          - --trace-stat
          {{- end }}
          {{- if .Values.sensor.snapshotInterval }}
          - --snapshot-interval={{ .Values.sensor.snapshotInterval }}
          {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        {{- with .Values.sensor.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: sys-kernel-btf
          mountPath: /sys/kernel/btf
          readOnly: true
        # The sensor only ever stats cgroup directories (to read their inode as
        # the cgroup ID) and reads cgroup.procs. It never writes here, so the
        # mount is read-only — a write-capable mount on /sys/fs/cgroup is an
        # unnecessary privilege ask that hardened node OSes may refuse.
        - name: sys-fs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: nri-socket
          mountPath: /var/run/nri
        {{- if not .Values.sensor.controllerURL }}
        - name: profiles
          mountPath: /profiles
        {{- else if $tokenEnabled }}
        - name: controller-token
          mountPath: /var/run/secrets/tracepod/controller-token
          readOnly: true
        {{- end }}
      volumes:
      - name: sys-kernel-btf
        hostPath:
          path: /sys/kernel/btf
          type: Directory
      - name: sys-fs-cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: nri-socket
        hostPath:
          path: /var/run/nri
          type: DirectoryOrCreate
      {{- if not .Values.sensor.controllerURL }}
      - name: profiles
        hostPath:
          path: {{ .Values.sensor.profileHostPath }}
          type: DirectoryOrCreate
      {{- else if $tokenEnabled }}
      # Projected ServiceAccount token for --controller-token-file, bound to
      # the configured audience; the kubelet rotates it before it expires.
      - name: controller-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: {{ required "sensor.controllerToken.audience is required when sensor.controllerToken.enabled is true" (dig "controllerToken" "audience" "tracepod-ingest" .Values.sensor) | quote }}
              expirationSeconds: {{ dig "controllerToken" "expirationSeconds" 3600 .Values.sensor | int }}
      {{- end }}
      {{- with .Values.sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
