apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tracepod.sensorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracepod.sensorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tracepod-sensor
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "tracepod.sensorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tracepod.sensorName" . }}
      # hostPID is required so bpf_get_current_pid_tgid() returns PIDs visible
      # in the host /proc, enabling CWD resolution for relative-path openat events.
      hostPID: true
      containers:
      - name: sensor
        image: "{{ .Values.sensor.image.repository }}:{{ .Values.sensor.image.tag }}"
        imagePullPolicy: {{ .Values.sensor.image.pullPolicy }}
        args:
          - --node-name=$(NODE_NAME)
          {{- if .Values.sensor.controllerURL }}
          - --controller-url={{ .Values.sensor.controllerURL }}
          {{- else }}
          - --profile-dir=/profiles
          {{- end }}
          {{- if .Values.sensor.ringbufBytes }}
          - --ringbuf-bytes={{ .Values.sensor.ringbufBytes }}
          {{- end }}
          {{- if .Values.sensor.traceStat }}
          - --trace-stat
          {{- end }}
          {{- if .Values.sensor.postUnownedPodsNamespace }}
          - --post-unowned-pods-namespace={{ .Values.sensor.postUnownedPodsNamespace }}
          {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        {{- with .Values.sensor.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: sys-kernel-btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: sys-fs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: false
        - name: nri-socket
          mountPath: /var/run/nri
        {{- if not .Values.sensor.controllerURL }}
        - name: profiles
          mountPath: /profiles
        {{- end }}
      volumes:
      - name: sys-kernel-btf
        hostPath:
          path: /sys/kernel/btf
          type: Directory
      - name: sys-fs-cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: nri-socket
        hostPath:
          path: /var/run/nri
          type: DirectoryOrCreate
      {{- if not .Values.sensor.controllerURL }}
      - name: profiles
        hostPath:
          path: {{ .Values.sensor.profileHostPath }}
          type: DirectoryOrCreate
      {{- end }}
      {{- with .Values.sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
