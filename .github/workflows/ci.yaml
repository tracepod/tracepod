name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: vet (darwin/arm64 compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet (darwin-compatible packages)
        run: GOOS=darwin GOARCH=arm64 go vet ./...
      - name: go build check (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./...
      # Run tests natively on Linux. Exclude internal/probe and cmd/sensor:
      # they require 'make generate' (clang + bpftool) to produce BPF object
      # files that are not committed for the amd64 arch (only arm64 is committed).
      - name: go test -short (native linux)
        run: |
          go list ./... \
            | grep -Ev 'internal/probe$|cmd/sensor$' \
            | xargs go test -short

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 3m

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint helm/tracepod

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
