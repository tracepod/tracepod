version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - misspell
  exclusions:
    # internal/probe and cmd/sensor depend on bpf2go-generated files that are
    # only committed for arm64; amd64 objects are produced by `make generate`
    # during release CI. The lint job has no BPF toolchain, so skip these paths.
    paths:
      - internal/probe
      - cmd/sensor
    rules:
      # errcheck: allow unhandled errors on defer Close calls (common pattern)
      - linters: [errcheck]
        text: "defer.*Close"
      # errcheck: flag.Parse with ExitOnError never returns an actionable error
      - linters: [errcheck]
        text: "fs.Parse"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tracepod/tracepod
