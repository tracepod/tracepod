version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - misspell
  settings:
    errcheck:
      # Best-effort closes and cleanups. Tar/gzip writer Close failures can
      # mask data loss in principle, but in this codebase they're always
      # paired with a captured write error (e.g. via pw.CloseWithError(err)).
      # errcheck matches against concrete receiver types — list each one used.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.File).Write
        - (*archive/tar.Writer).Close
        - (*compress/gzip.Writer).Close
        - (*debug/elf.File).Close
        - (*bufio.Writer).Flush
        - (*text/tabwriter.Writer).Flush
        - os.RemoveAll
        - os.Remove
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    # internal/probe and cmd/sensor depend on bpf2go-generated files that are
    # only committed for arm64; amd64 objects are produced by `make generate`
    # during release CI. The lint job has no BPF toolchain.
    paths:
      - internal/probe
      - cmd/sensor
    rules:
      # Tests routinely defer close on readers and don't propagate errors.
      - linters: [errcheck]
        path: _test\.go
      # flag.Parse with ExitOnError never returns an actionable error.
      - linters: [errcheck]
        text: "fs.Parse"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tracepod/tracepod
