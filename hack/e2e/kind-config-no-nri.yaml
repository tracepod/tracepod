kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tracepod-e2e-no-nri

# Negative-path twin of kind-config.yaml: explicitly DISABLE NRI. kind's node
# image ships containerd 2.x, which enables NRI by default (see
# docs/KNOWN-LIMITATIONS.md §0.6 — "containerd upstream default ... On by
# design"), so this must be an explicit `disable = true`, not an omitted
# patch, to actually reproduce the "NRI unavailable" condition.
containerdConfigPatches:
  - |
    [plugins."io.containerd.nri.v1.nri"]
      disable = true
      socket_path = "/var/run/nri/nri.sock"

nodes:
  - role: control-plane
