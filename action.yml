# Tracepod GitHub Action — harden a container image in CI.
#
# Profile your app during CI e2e tests (or bring a recorded profile), then
# harden, smoke-test, and SBOM the image as part of the release pipeline:
#
#   - uses: tracepod/tracepod@v0.2.4
#     with:
#       manifest: profiles/app/files.json
#       source: ghcr.io/acme/app:${{ github.sha }}
#       push: ghcr.io/acme/app:${{ github.sha }}-hardened
#
# Outputs the OCI layout path and SBOM paths for follow-up steps
# (cosign attach, release upload, registry scan).
name: 'Tracepod Harden'
description: 'Build a minimized, runtime-profiled hardened image with SBOMs from a Tracepod profile'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  manifest:
    description: 'Path to the Tracepod profile JSON (sensor output, files.json)'
    required: true
  source:
    description: 'Source image reference the profile was recorded against'
    required: true
  output:
    description: 'Directory for the hardened OCI layout'
    required: false
    default: 'hardened-oci'
  push:
    description: 'Registry reference to push the hardened image to (empty = build only)'
    required: false
    default: ''
  platform:
    description: 'Target platform'
    required: false
    default: 'linux/amd64'
  include:
    description: 'Newline-separated extra include paths'
    required: false
    default: ''
  smoke-test:
    description: 'Run the built image in the runner Docker daemon and fail if it cannot boot'
    required: false
    default: 'true'
  version:
    description: 'Tracepod release version to install'
    required: false
    default: 'latest'

outputs:
  oci-path:
    description: 'Path of the hardened OCI layout'
    value: ${{ inputs.output }}
  sbom-cyclonedx:
    description: 'Path of the CycloneDX SBOM'
    value: ${{ inputs.output }}/sbom.cyclonedx.json
  sbom-spdx:
    description: 'Path of the SPDX SBOM'
    value: ${{ inputs.output }}/sbom.spdx.json

runs:
  using: 'composite'
  steps:
    - name: Install tracepod harden
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="$VERSION_INPUT"
        if [ "$VERSION" = "latest" ]; then
          # Resolve the "latest" release via the redirect from /releases/latest
          # rather than the GitHub API — avoids the unauthenticated 60/hr rate
          # limit on shared runner IPs and the jq dependency.
          LATEST_URL=$(curl -fsSLo /dev/null -w '%{url_effective}' \
            https://github.com/tracepod/tracepod/releases/latest)
          VERSION="${LATEST_URL##*/}"
          case "$VERSION" in
            v*) ;;
            *) echo "error: could not resolve latest release tag (got $LATEST_URL)" >&2; exit 1 ;;
          esac
        fi
        ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; esac
        curl -fsSL "https://github.com/tracepod/tracepod/releases/download/${VERSION}/tracepod_harden_${VERSION#v}_linux_${ARCH}.tar.gz" \
          | tar -xz harden
        sudo install harden /usr/local/bin/harden
        harden version || true

    - name: Install syft (SBOM)
      shell: bash
      env:
        SYFT_VERSION: '1.54.0' # keep in sync with .github/workflows/e2e-al2023.yaml
      run: |
        set -euo pipefail
        if command -v syft >/dev/null; then
          exit 0
        fi
        ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; esac
        curl -fsSL -o "/tmp/syft_${SYFT_VERSION}_linux_${ARCH}.tar.gz" \
          "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${ARCH}.tar.gz"
        curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt" \
          | grep -E "syft_${SYFT_VERSION}_linux_${ARCH}\.tar\.gz\$" > /tmp/syft.sha256
        (cd /tmp && sha256sum -c syft.sha256)
        tar -xzf "/tmp/syft_${SYFT_VERSION}_linux_${ARCH}.tar.gz" -C /tmp syft
        sudo install -m 0755 /tmp/syft /usr/local/bin/syft

    - name: Harden
      shell: bash
      env:
        IN_MANIFEST: ${{ inputs.manifest }}
        IN_SOURCE: ${{ inputs.source }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_PLATFORM: ${{ inputs.platform }}
        IN_PUSH: ${{ inputs.push }}
        IN_SMOKE_TEST: ${{ inputs.smoke-test }}
        IN_INCLUDE: ${{ inputs.include }}
      run: |
        set -euo pipefail
        ARGS=(--manifest "$IN_MANIFEST" --source "$IN_SOURCE" \
              --output "$IN_OUTPUT" --platform "$IN_PLATFORM" --sbom)
        if [ -n "$IN_PUSH" ]; then ARGS+=(--push "$IN_PUSH"); fi
        if [ "$IN_SMOKE_TEST" = "true" ]; then ARGS+=(--smoke-test); fi
        while IFS= read -r p; do
          [ -n "$p" ] && ARGS+=(--include "$p")
        done <<< "$IN_INCLUDE"
        harden build "${ARGS[@]}"
